<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            grid-column: 1 / -1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .result {
            margin-top: 35px;
            border-top: 1px solid #ddd;
            padding-top: 25px;
        }

        .result h2 {
            text-align: center;
            color: #2c3e50;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            width: 180px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .card-title {
            color: #666;
            margin-bottom: 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        .chart {
            text-align: center;
        }

        .chart img {
            width: 100%;
            max-width: 700px;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            button {
                grid-column: 1;
            }

            .cards {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Quản lý sinh viên</h1>

        <p class="description">
            Nhập số lượng sinh viên nam và nữ trong lớp
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="male">
                    Số sinh viên nam
                </label>

                <input
                    type="number"
                    id="male"
                    name="male"
                    min="0"
                    required
                    placeholder="Nhập số nam"
                >
            </div>

            <div class="form-group">
                <label for="female">
                    Số sinh viên nữ
                </label>

                <input
                    type="number"
                    id="female"
                    name="female"
                    min="0"
                    required
                    placeholder="Nhập số nữ"
                >
            </div>

            <button type="submit">
                Hiển thị biểu đồ
            </button>

        </form>


        {% if male is not none and female is not none %}

        <div class="result">

            <h2>Kết quả</h2>

            <div class="cards">

                <div class="card">
                    <div class="card-title">
                        Nam
                    </div>

                    <div class="number">
                        {{ male }}
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Nữ
                    </div>

                    <div class="number">
                        {{ female }}
                    </div>
                </div>

            </div>


            <div class="chart">

                <img
                    src="{{ url_for('static', filename='chart.png') }}"
                    alt="Biểu đồ số lượng sinh viên"
                >

            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
